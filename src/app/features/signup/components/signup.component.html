<div class="signup-page">
    <div class="signup-container">
        <div class="signup-banner">

            <div class="member-badge">
                CAPGEMINI MEMBER
            </div>

            <div class="banner-content">
                <h1 class="banner-title">
                    Join the premium corporate meal experience
                </h1>

                <p class="banner-subtitle">
                    Verify your Employee GGID to claim healthy meals and coordinate
                    lunch reservations with your peers.
                </p>
            </div>

        </div>

        <div class="signup-form-side">

            <div class="brand-logo">
                <div class="logo-icon">
                    C
                </div>

                <div class="logo-text">
                    <span class="brand-name">CapMeals</span>
                    <span class="brand-subtitle">
                        Corporate Dining Platform
                    </span>
                </div>
            </div>

            <div class="form-header">
                <h2>Create CapMeals Account</h2>
            </div>

            <form class="form-fields">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input id="fullName" type="text" placeholder="John Doe" />
                </div>

                <div class="form-group">
                    <label for="ggid">
                        Employee GGID (Global Grade ID)
                    </label>

                    <input id="ggid" type="text" placeholder="e.g. 1048291" />
                </div>

                <div class="form-group">
                    <label for="email">Corporate Email</label>

                    <input id="email" type="email" placeholder="username@capgemini.com" />
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-field">
                        <input id="password" type="password" placeholder="At least 8 characters" />

                        <i class="pi pi-eye"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-field">
                        <input id="confirmPassword" type="password" placeholder="Repeat your password" />

                        <i class="pi pi-eye"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary signup-btn">
                    Create Account
                </button>

            </form>

            <div class="form-footer">
                <span>Already have an account?</span>

                <a routerLink="/login">
                    Sign In
                </a>
            </div>

        </div>

    </div>
</div>
