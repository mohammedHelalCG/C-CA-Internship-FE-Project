<div class="meal-form">

  <h1>
    {{ isEditMode ? 'Edit Meal' : 'Create Meal' }}
  </h1>

  <!-- Meal Name -->
  <div class="form-field">
    <label for="name">Meal Name</label>

    <input
      id="name"
      type="text"
      pInputText
      [(ngModel)]="meal.name"
      placeholder="Enter meal name"
    />
  </div>

  <!-- Category -->
  <div class="form-field">
    <label for="category">Category</label>

    <p-select
      id="category"
      [options]="categories"
      [(ngModel)]="meal.category"
      placeholder="Select category"
    >
    </p-select>

    @if (!meal.category) {
      <small class="error">
        Category is required.
      </small>
    }
  </div>

  <!-- Price -->
  <div class="form-field">
    <label for="price">Price</label>

    <p-inputnumber
      id="price"
      [(ngModel)]="meal.price"
      mode="currency"
      currency="EGP"
      locale="en-EG"
    >
    </p-inputnumber>
  </div>

  <!-- Description -->
  <div class="form-field">
    <label for="description">Description</label>

    <textarea
      id="description"
      pTextarea
      [(ngModel)]="meal.description"
      placeholder="Enter meal description"
      rows="5"
    >
    </textarea>
  </div>

  <!-- Image -->
  <div class="form-field">
    <label for="image">Image (Optional)</label>

    <input
      id="image"
      type="file"
      accept="image/*"
    />
  </div>

  <!-- Save / Update -->
  <p-button
    [label]="isEditMode ? 'Update Meal' : 'Save Meal'"
    (onClick)="saveMeal()"
    [disabled]="!meal.category"
  >
  </p-button>

</div>
