<p-card class="w-full overflow-hidden">
  <ng-template #header>
    <div class="relative">
      <img class="w-full object-cover" alt="user header" [src]="image" />
    </div>
  </ng-template>
  <ng-template #title>
    <span class="font-bold text-xl">{{ name }}</span>
  </ng-template>
  <ng-template #subtitle>
    <div class="space-y-4">
      <p>{{ description }}</p>
    </div>
    <div class="flex items-center gap-2">
      @for (tag of tags; track $index) {
      <p-tag [severity]="tag.color" [value]="tag.name" />
      }
    </div>
  </ng-template>
  <ng-template #footer>
    <div class="flex items-center gap-2 mt-4">
      <button type="button" class="btn btn-secondary" (click)="viewDetails()">View Details</button>
    </div>
  </ng-template>
</p-card>
